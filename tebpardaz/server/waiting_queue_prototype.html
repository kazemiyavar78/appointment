<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وضعیت نوبت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF3F1; --ink:#16231F; --ink-soft:#4B5A54; --line:rgba(22,35,31,.12);
    --calm:#2F6F5E; --calm-bg:#E3EEEA;
    --approach:#B8791A; --approach-bg:#F5EBD8;
    --urgent:#C4432A; --urgent-bg:#F7E4DE;
    --now:#7A1E3C; --now-bg:#F3DDE5;
    --accent: var(--calm); --accent-bg: var(--calm-bg);
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:24px;
    transition: background-color .6s ease;
  }
  body.state-approaching{ background: color-mix(in srgb, var(--bg) 70%, var(--approach-bg)); }
  body.state-urgent{ background: color-mix(in srgb, var(--bg) 55%, var(--urgent-bg)); }
  body.state-now{ background: var(--now-bg); }

  .card{
    width:100%; max-width:420px;
    text-align:center;
  }
  .clinic{
    font-size:14px; color:var(--ink-soft); font-weight:500;
    margin-bottom:6px; letter-spacing:.2px;
  }
  .patient-name{
    font-size:20px; font-weight:700; margin-bottom:28px;
  }

  .ring-wrap{ position:relative; width:260px; height:260px; margin:0 auto 20px; }
  svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--line); stroke-width:14; }
  .ring-fg{
    fill:none; stroke:var(--accent); stroke-width:14; stroke-linecap:round;
    transition: stroke-dashoffset 1s cubic-bezier(.4,0,.2,1), stroke .6s ease;
  }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring-number{
    font-size:76px; font-weight:900; line-height:1; color:var(--ink);
    font-variant-numeric:tabular-nums; transition: color .6s ease;
  }
  .ring-label{
    font-size:15px; color:var(--ink-soft); margin-top:6px; font-weight:500;
  }
  .state-now .ring-number{ color:var(--now); }
  .state-now .ring-wrap{ animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); }
  }
  @media (prefers-reduced-motion: reduce){
    .state-now .ring-wrap{ animation:none; }
    .ring-fg{ transition:none; }
  }

  .status-banner{
    font-size:17px; font-weight:700; padding:14px 18px; border-radius:14px;
    background:var(--accent-bg); color:var(--accent); margin-bottom:18px;
    transition: background-color .6s ease, color .6s ease;
  }

  .meta{
    display:flex; justify-content:space-between; gap:12px;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:16px; font-size:14px;
  }
  .meta div{ text-align:center; flex:1; }
  .meta b{ display:block; font-size:15px; margin-top:2px; }
  .meta .divider{ width:1px; background:var(--line); flex:0 0 1px; }

  .conn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:13px; color:var(--ink-soft);
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--calm); flex:0 0 auto; }
  .dot.offline{ background:var(--urgent); }
  .dot.pulse-dot{ animation: dotpulse 1.6s ease-in-out infinite; }
  @keyframes dotpulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .confirm-btn{
    display:none; width:100%; margin-top:16px; padding:16px;
    background:var(--now); color:#fff; border:none; border-radius:14px;
    font-family:inherit; font-size:17px; font-weight:700; cursor:pointer;
  }
  .state-now .confirm-btn{ display:block; }

  .sound-toggle{
    margin-top:22px; background:none; border:1px solid var(--line);
    border-radius:999px; padding:9px 16px; font-size:13px; color:var(--ink-soft);
    font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .sound-toggle[data-on="true"]{ border-color:var(--calm); color:var(--calm); }

  .demo-panel{
    max-width:420px; width:100%; margin:18px auto 0; padding:12px 14px;
    border:1px dashed var(--line); border-radius:12px; font-size:12px;
    color:var(--ink-soft); text-align:center;
  }
  .demo-panel button{
    margin-inline-start:8px; font-family:inherit; font-size:12px;
    padding:6px 10px; border-radius:8px; border:1px solid var(--line);
    background:#fff; cursor:pointer;
  }
  .sr-only{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);
  }
</style>
</head>
<body>
  <div>
    <div class="card">
      <div class="clinic">درمانگاه تخصصی امید</div>
      <div class="patient-name">آقای رضایی</div>

      <div class="ring-wrap">
        <svg viewBox="0 0 260 260">
          <circle class="ring-bg" cx="130" cy="130" r="112"/>
          <circle id="ringFg" class="ring-fg" cx="130" cy="130" r="112"
                  stroke-dasharray="703.7" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-center">
          <div class="ring-number" id="ringNumber" aria-live="polite">۱۴</div>
          <div class="ring-label" id="ringLabel">نفر جلوتر از شما</div>
        </div>
      </div>

      <div class="status-banner" id="statusBanner" role="status" aria-live="polite">
        می‌توانید در محیط دیگری منتظر بمانید، به‌موقع خبر می‌دهیم
      </div>

      <div class="meta">
        <div>پزشک<b>دکتر احمدی</b></div>
        <div class="divider"></div>
        <div>ساعت نوبت<b>۱۰:۳۰</b></div>
        <div class="divider"></div>
        <div>شمارهٔ پذیرش<b>۲۴۸</b></div>
      </div>

      <div class="conn">
        <span class="dot pulse-dot" id="connDot"></span>
        <span id="connText">بروزرسانی زنده — همین الان</span>
      </div>

      <button class="confirm-btn" id="confirmBtn">نوبت شماست — تأیید می‌کنم که در راهم</button>

      <button class="sound-toggle" id="soundToggle" data-on="false">
        🔔 فعال‌سازی صدا و لرزش هشدار
      </button>
    </div>
  </div>

  <div class="demo-panel">
    فقط برای نمایش این پروتوتایپ — داده واقعی از WebSocket می‌آید.
    <button id="demoStep">نفر بعدی</button>
    <button id="demoReset">ریست</button>
  </div>

<script>
/* ============================================================
   منطق واقعی (در پروژه شما داخل waiting_queue.js می‌رود)
   ============================================================ */

const faDigits = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

// آستانه‌های حالت — این thresholdها را می‌توانید سمت سرور (Refresher) هم محاسبه
// و به‌جای عدد خام، فیلد status را مستقیم در پیام WebSocket بفرستید.
function stateFor(n){
  if (n <= 0) return 'now';
  if (n <= 2) return 'urgent';
  if (n <= 10) return 'approaching';
  return 'calm';
}

const STATE_META = {
  calm:        { label: 'می‌توانید در محیط دیگری منتظر بمانید، به‌موقع خبر می‌دهیم' },
  approaching: { label: 'نوبت شما نزدیک می‌شود — بهتر است در دسترس باشید' },
  urgent:      { label: 'نوبت شما خیلی نزدیک است، لطفاً به مطب مراجعه کنید' },
  now:         { label: 'نوبت شماست' },
};

const RING_CIRCUMFERENCE = 703.7; // 2*pi*112
const RING_MAX = 20; // بیشتر از این مقدار، حلقه پر نشان داده می‌شود

const ringFg     = document.getElementById('ringFg');
const ringNumber = document.getElementById('ringNumber');
const ringLabel  = document.getElementById('ringLabel');
const banner     = document.getElementById('statusBanner');
const body       = document.body;
const connDot    = document.getElementById('connDot');
const connText   = document.getElementById('connText');
const confirmBtn = document.getElementById('confirmBtn');
const soundToggle= document.getElementById('soundToggle');

let currentState = 'calm';
let soundEnabled = false;
let lastUpdateAt = Date.now();

function applyPosition(n){
  const clamped = Math.max(0, Math.min(n, RING_MAX));
  const ratio = 1 - (clamped / RING_MAX);
  ringFg.style.strokeDashoffset = (RING_CIRCUMFERENCE * ratio).toFixed(1);

  ringNumber.textContent = n <= 0 ? 'حالا' : faDigits(n);
  ringLabel.textContent  = n <= 0 ? '' : 'نفر جلوتر از شما';

  const newState = stateFor(n);
  if (newState !== currentState){
    const escalating = ['calm','approaching','urgent','now'].indexOf(newState)
                      > ['calm','approaching','urgent','now'].indexOf(currentState);
    currentState = newState;
    body.className = 'state-' + newState;
    banner.textContent = STATE_META[newState].label;

    if (escalating && (newState === 'urgent' || newState === 'now') && soundEnabled){
      playAlert(newState === 'now');
    }
  }
}

// --- صدا (Web Audio API) ---
let audioCtx;
function playAlert(strong){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const beep = (freq, start, dur) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + start);
      osc.stop(audioCtx.currentTime + start + dur);
    };
    beep(880, 0, 0.18);
    beep(880, 0.24, 0.18);
    if (strong) beep(1046, 0.48, 0.28);
  }catch(e){ /* تعامل کاربر لازم است؛ اگر مرورگر مسدود کرد، بی‌صدا رد شو */ }

  if (navigator.vibrate){
    navigator.vibrate(strong ? [220,90,220,90,320] : [180,80,180]);
  }
}

soundToggle.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundToggle.dataset.on = soundEnabled;
  soundToggle.textContent = soundEnabled ? '🔔 صدا و لرزش فعال است' : '🔔 فعال‌سازی صدا و لرزش هشدار';
  if (soundEnabled){
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
});

confirmBtn.addEventListener('click', () => {
  confirmBtn.textContent = 'ثبت شد ✓';
  confirmBtn.disabled = true;
  // اینجا یک پیام روی همان WebSocket به سرور بفرستید:
  // ws.send(JSON.stringify({type: "confirm_arrival"}))
});

// --- وضعیت اتصال ---
function tickConnLabel(){
  const secs = Math.round((Date.now() - lastUpdateAt) / 1000);
  connText.textContent = secs < 2 ? 'بروزرسانی زنده — همین الان' : `آخرین بروزرسانی: ${faDigits(secs)} ثانیه پیش`;
  connDot.classList.toggle('offline', secs > 15);
  connDot.classList.toggle('pulse-dot', secs <= 15);
}
setInterval(tickConnLabel, 1000);

/* ============================================================
   اتصال واقعی WebSocket — این بخش را جایگزین شبیه‌سازی زیر کنید
   ============================================================

  const ws = new WebSocket(`wss://YOUR_HOST/${admission_no}/${national_id}/.../ws/waiting-queue`);

  ws.onopen = () => { connDot.classList.remove('offline'); };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data); // { position_ahead: 7, doctor: "...", time: "...", status?: "..." }
    lastUpdateAt = Date.now();
    applyPosition(data.position_ahead);
  };

  ws.onclose = () => {
    connDot.classList.add('offline');
    connText.textContent = 'اتصال قطع شد — در حال تلاش مجدد...';
    setTimeout(() => location.reload(), 4000); // یا منطق reconnect خودتان
  };
*/

// ---- شبیه‌سازی فقط برای این دمو ----
let demoPos = 14;
applyPosition(demoPos);
document.getElementById('demoStep').addEventListener('click', () => {
  demoPos = Math.max(0, demoPos - 1);
  lastUpdateAt = Date.now();
  applyPosition(demoPos);
});
document.getElementById('demoReset').addEventListener('click', () => {
  demoPos = 14;
  lastUpdateAt = Date.now();
  applyPosition(demoPos);
});
</script>
</body>
</html>
